# Instance-specific drop-in for mcp-server-container-context@0.
#
# Quadlet reads this alongside the template drop-in
# (mcp-server-container-context@.container.d/). On current stable Podman the
# instance still has to exist explicitly, e.g.
#   ln -s mcp-server-container-context@.container mcp-server-container-context@0.container
# An instance drop-in directory alone only instantiates the template on newer
# Podman versions. LOG_LEVEL is intentionally unset so the default (info) is used.

[Container]
Environment=CLOUDFLARE_ACCESS_TEAM_DOMAIN=team-name.cloudflareaccess.com
Environment=CLOUDFLARE_ACCESS_APPLICATION_AUD=your-access-application-aud-tag
