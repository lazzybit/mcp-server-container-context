# Instance-specific drop-in for mcp-server-container-context@0.
#
# The public host this controller is reached at; it drives the Host/Origin
# checks on /mcp. Kept separate from cloudflare-access.conf because it
# describes the MCP endpoint itself, not the Cloudflare Access integration.
# See cloudflare-access.conf for the template/instance drop-in notes.

[Container]
Environment=MCP_DOMAIN=mcp.example.com
