# Build the single Containerfile with Podman on native runners and publish a
# two-platform manifest list to GHCR. Pull requests and non-main refs build and
# smoke-test only; nothing is published unless the ref is `main`.
name: image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/lazzybit/mcp-server-container-context

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
            platform: linux/arm64/v8
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | podman login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build image
        run: |
          set -euo pipefail
          podman build --file Containerfile \
            --tag "$IMAGE:sha-$GITHUB_SHA-${{ matrix.arch }}" \
            --label org.opencontainers.image.source=https://github.com/lazzybit/mcp-server-container-context \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            .

      - name: Smoke test /healthz
        run: |
          set -euo pipefail
          image="$IMAGE:sha-$GITHUB_SHA-${{ matrix.arch }}"
          podman run --detach --name smoke -p 8000:8000 \
            -e TEAM_DOMAIN=localhost \
            -e APPLICATION_AUD=smoke \
            -e MCP_DOMAIN=localhost \
            "$image"
          ready=0
          for attempt in $(seq 1 30); do
            body="$(curl --fail --silent --max-time 5 http://127.0.0.1:8000/healthz)" || body=""
            if [ "$body" = '{"status":"ok"}' ]; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::/healthz did not return {\"status\":\"ok\"} within 30s"
            podman logs smoke || true
            exit 1
          fi

      - name: Remove smoke container
        if: always()
        run: podman rm --force smoke || true

      - name: Push per-architecture image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          podman push --digestfile "digest-${{ matrix.arch }}.txt" \
            "$IMAGE:sha-$GITHUB_SHA-${{ matrix.arch }}"

      - name: Upload digest
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digest-${{ matrix.arch }}
          path: digest-${{ matrix.arch }}.txt
          if-no-files-found: error

  manifest:
    name: manifest
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | podman login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Assemble and push sha manifest
        run: |
          set -euo pipefail
          tag="sha-$GITHUB_SHA"
          podman manifest create "$IMAGE:$tag"
          podman manifest add --os linux --arch amd64 \
            "$IMAGE:$tag" "docker://$IMAGE@$(cat digests/digest-amd64.txt)"
          podman manifest add --os linux --arch arm64 --variant v8 \
            "$IMAGE:$tag" "docker://$IMAGE@$(cat digests/digest-arm64.txt)"
          podman manifest push --all "$IMAGE:$tag"

      - name: Verify sha manifest platforms
        run: |
          set -euo pipefail
          skopeo inspect --raw "docker://$IMAGE:sha-$GITHUB_SHA" | jq -e '
            ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")] | length) == 1
            and
            ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64" and .platform.variant == "v8")] | length) == 1
          ' > /dev/null

      - name: Assemble and push latest manifest
        run: |
          set -euo pipefail
          podman manifest create "$IMAGE:latest"
          podman manifest add --os linux --arch amd64 \
            "$IMAGE:latest" "docker://$IMAGE@$(cat digests/digest-amd64.txt)"
          podman manifest add --os linux --arch arm64 --variant v8 \
            "$IMAGE:latest" "docker://$IMAGE@$(cat digests/digest-arm64.txt)"
          podman manifest push --all "$IMAGE:latest"

      - name: Verify latest manifest platforms
        run: |
          set -euo pipefail
          skopeo inspect --raw "docker://$IMAGE:latest" | jq -e '
            ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")] | length) == 1
            and
            ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64" and .platform.variant == "v8")] | length) == 1
          ' > /dev/null
